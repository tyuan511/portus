name: Release Portus

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  macos-arm64:
    name: macOS arm64
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RUST_TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET" --no-self-update

      - name: Verify tag matches Cargo version
        id: version
        run: |
          version=$(cargo +stable metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "portus").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the Cargo package version v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun metal --version

      - name: Test and build
        run: |
          cargo +stable test --locked --release --target "$RUST_TARGET" --bin Portus
          cargo +stable build --locked --release --target "$RUST_TARGET" --bin Portus

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "No APPLE_CERTIFICATE_P12 secret configured; skipping Developer ID import."
            exit 0
          fi
          keychain="$RUNNER_TEMP/portus-signing.keychain-db"
          keychain_pass=$(openssl rand -base64 24)
          cert_path="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$cert_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          rm -f "$cert_path"
          security find-identity -v -p codesigning "$keychain"

          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            api_key_path="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$api_key_path"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          fi

      - name: Build disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package-macos.sh "target/$RUST_TARGET/release/Portus" "$VERSION" target/dist

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/portus-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p8" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          asset_name="Portus-$GITHUB_REF_NAME-macos-arm64.dmg"
          asset="target/dist/$asset_name"
          if release=$(gh release view "$GITHUB_REF_NAME" --json assets,isDraft 2>/dev/null); then
            if ! jq -e --arg name "$asset_name" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
            if [[ "$(jq -r .isDraft <<< "$release")" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag \
              --title "Portus $GITHUB_REF_NAME" --notes ""
          fi
