# Local development prerequisite services (PostgreSQL on non-default host port 15432).
# Usage:
#   make deps-up   (or `make dev` / `make start` for one-click startup)
#   make deps-down

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulwark-dev-postgres
    environment:
      POSTGRES_USER: bulwark
      POSTGRES_PASSWORD: bulwark
      POSTGRES_DB: bulwark
    ports:
      - "15432:5432"
    volumes:
      - bulwark_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulwark -d bulwark"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  bulwark_dev_pgdata:
