[workspace]
resolver = "2"
members = [
    "crates/sshield-core",
    "crates/sshield-vault",
    "crates/sshield-ssh",
    "crates/sshield-security",
    "crates/sshield-mcp",
    "crates/sshield-storage",
    "apps/server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
regex = "1"
dirs = "6"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Domain-specific dependencies
brush-parser = "0.4"
russh = "0.65"
ssh2-config = "0.9"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
