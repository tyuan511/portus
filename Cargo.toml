[package]
name = "portus"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "Portus"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
async-channel = "2"
data-encoding = "2"
dirs = "5"
gpui-kit = "=0.7.0"
gpui-terminal = { path = "vendor/gpui-terminal" }
rand = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
shell-words = "1"
ssh2-config = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "io-std", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
raw-window-handle = "0.6"
